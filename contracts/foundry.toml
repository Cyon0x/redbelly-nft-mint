[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
gas_reports = ["Vault01Genesis"]
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
redbelly_mainnet = "${REDBELLY_MAINNET_RPC_URL}"
redbelly_testnet = "${REDBELLY_TESTNET_RPC_URL}"

# Routescan exposes an Etherscan-compatible API per network.
# Mainnet (chain 151) endpoint verified reachable during discovery.
[etherscan]
redbelly_mainnet = { key = "${EXPLORER_API_KEY}", chain = 151, url = "${EXPLORER_API_URL}" }
redbelly_testnet = { key = "${EXPLORER_API_KEY}", chain = 153, url = "${EXPLORER_TESTNET_API_URL}" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
